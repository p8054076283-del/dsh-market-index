name: update-index

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install validator dependency
        run: npm install --omit=dev --no-audit --no-fund

      - name: Build index from the community catalog
        run: node scripts/build-index.mjs --out index.json --concurrency 24

      - name: Validate against the DSH format-1 validator
        run: node scripts/build-index.mjs --check --out index.json

      - name: Commit when the catalog changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "index unchanged"
          else
            git commit -m "chore: refresh plugin index"
            git push
          fi
